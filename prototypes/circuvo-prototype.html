/* ---------- minimal UI primitives replacing shadcn/ui ---------- */
function Button({ variant, size, className = "", style = {}, children, ...rest }) {
  const base = "text-sm rounded-md transition-colors";
  const sizing = size === "icon" ? "w-9 h-9 flex items-center justify-center" : "px-4 py-2";
  const look =
    variant === "outline"
      ? { background: "transparent", border: `0.5px solid ${style.borderColor || theme.border}` }
      : { background: theme.muted, border: "none" };
  return (
    <button className={`${base} ${sizing} ${className}`} style={{ ...look, ...style }} {...rest}>
      {children}
    </button>
  );
}
function PrimaryButton({ children, onClick, className = "", disabled, ...rest }) {
  const [hover, setHover] = useState(false);
  return (
    <button
      onClick={onClick}
      disabled={disabled}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        background: disabled ? theme.muted : hover ? "oklch(0.4600 0.1347 144.1672)" : theme.primary,
        color: disabled ? theme.mutedForeground : theme.primaryForeground,
        boxShadow: hover && !disabled ? "0 4px 10px rgba(15,110,86,0.35)" : "0 1px 3px rgba(15,110,86,0.25)",
        transform: hover && !disabled ? "translateY(-1px)" : "none",
        transition: "all 0.15s ease",
        cursor: disabled ? "default" : "pointer",
      }}
      className={`text-sm px-4 py-2 rounded-md flex items-center justify-center gap-2 ${className}`}
      {...rest}
    >
      {children}
    </button>
  );
}
function Card({ className = "", style = {}, children, ...rest }) {
  return (
    <div className={`rounded-xl ${className}`} style={{ border: `0.5px solid ${theme.border}`, ...style }} {...rest}>
      {children}
    </div>
  );
}
function CardContent({ className = "", children }) {
  return <div className={className}>{children}</div>;
}
function Badge({ className = "", style = {}, children }) {

    <span className={`inline-block text-xs px-2 py-0.5 rounded-md ${className}`} style={style}>
      {children}

}
function Avatar({ className = "", children }) {

}
function AvatarFallback({ style = {}, children }) {

}
function Input(props) {

}
function Separator({ orientation, className = "", style = {} }) {
  if (orientation === "vertical") {

  return <div className={className} style={{ height: 1, background: theme.border, ...style }} />;

function TopBar({ onBack, onLogoClick, onBrowseClick, onListingsClick, onPostClick, onCartClick, onAccountClick, onMessagesClick, onSignOut, profile, cartCount = 0, activeNav = "browse", searchValue, onSearchChange }) {
  const [menuOpen, setMenuOpen] = useState(false);
  // On the Marketplace the search filters live. Everywhere else it keeps
  // what you type here and, on Enter, opens the Marketplace with results.
  const headerSearch = useContext(HeaderSearchContext);
  const [draftSearch, setDraftSearch] = useState("");
  const isLiveSearch = !!onSearchChange;
  const searchText = isLiveSearch ? searchValue || "" : draftSearch;
  const setSearchText = (v) => (isLiveSearch ? onSearchChange(v) : setDraftSearch(v));
  const submitSearch = () => {
    const q = searchText.trim();
    if (isLiveSearch) { if (headerSearch) headerSearch.showResults(); return; }
    if (q && headerSearch) headerSearch.search(q);
  };
  const navBtn = (active) => ({
    background: active ? theme.primary : "transparent",
    color: active ? theme.primaryForeground : theme.foreground,
    border: `1px solid ${active ? theme.primary : theme.border}`,
  });

function BackToTop() {
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const onScroll = () => setVisible(window.scrollY > 500);
    window.addEventListener("scroll", onScroll);
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  if (!visible) return null;
  return (
    <button
      onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })}
      aria-label="Back to top"
      style={{ background: theme.primary, color: theme.primaryForeground, boxShadow: "0 2px 8px rgba(0,0,0,0.2)" }}
      className="fixed bottom-24 md:bottom-6 right-4 md:right-6 w-11 h-11 rounded-full flex items-center justify-center z-20"
    >
      <ArrowUp size={18} />
    </button>
  );
}

// Phone and tablet version of the onboarding loop. The three steps sit on
// the right side of a closed, rounded track: down through List, Makers and
// Shop, around the bottom, back up the left side and into List again. Node
// positions are measured so the track always meets the circles, however
// the text wraps.
function PhoneLoop() {
  const wrapRef = useRef(null);
  const nodeRefs = [useRef(null), useRef(null), useRef(null)];
  const [geo, setGeo] = useState(null);
  const steps = [
    { title: "List", text: "Sell, repair or upcycle something you own.", Icon: Plus, big: false },
    { title: "Makers", text: "Local repairers, tailors, woodworkers and upcyclers. They repair and upcycle items, and sell what they create here.", Icon: Wrench, big: true },
    { title: "Shop", text: "Buy unique, one of a kind pieces, ready today.", Icon: ShoppingBag, big: false },
  ];
  React.useLayoutEffect(() => {
    const measure = () => {
      const wrap = wrapRef.current;
      if (!wrap || nodeRefs.some((r) => !r.current)) return;
      const box = wrap.getBoundingClientRect();
      const centers = nodeRefs.map((r) => {
        const n = r.current.getBoundingClientRect();
        return { x: n.left - box.left + n.width / 2, y: n.top - box.top + n.height / 2 };
      });
      setGeo({ w: box.width, h: box.height, centers });
    };
    measure();
    window.addEventListener("resize", measure);
    const ro = typeof ResizeObserver !== "undefined" ? new ResizeObserver(measure) : null;
    if (ro && wrapRef.current) ro.observe(wrapRef.current);
    return () => { window.removeEventListener("resize", measure); if (ro) ro.disconnect(); };
  }, []);

  let track = null;
  if (geo) {
    const [c1, c2, c3] = geo.centers;
    const x = c1.x, L = x - 52, ext = 44, r = 22;
    const top = c1.y - ext, bot = c3.y + ext;
    const d = `M ${x} ${c1.y} V ${bot - r} Q ${x} ${bot} ${x - r} ${bot} H ${L + r} Q ${L} ${bot} ${L} ${bot - r} V ${top + r} Q ${L} ${top} ${L + r} ${top} H ${x - r} Q ${x} ${top} ${x} ${top + r} Z`;
    const chevron = (key, cx, cy, angle) => (
      <path key={key} d="M-5,-5 L4,0 L-5,5" transform={`translate(${cx},${cy}) rotate(${angle})`}
        fill="none" stroke={theme.primary} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
    );
    track = (
      <svg width={geo.w} height={geo.h} style={{ position: "absolute", left: 0, top: 0, overflow: "visible" }} aria-hidden="true">
        <path d={d} fill="none" stroke={theme.accent} strokeWidth="3" />
        {chevron("down1", x, (c1.y + c2.y) / 2, 90)}
        {chevron("down2", x, (c2.y + c3.y) / 2, 90)}
        {chevron("bottom", (x + L) / 2, bot, 180)}
        {chevron("up", L, (top + bot) / 2, -90)}
        {chevron("top", (x + L) / 2, top, 0)}
      </svg>
    );
  }

  return (
    <div ref={wrapRef} className="relative mx-auto" style={{ maxWidth: 360, paddingLeft: 64, paddingTop: 48, paddingBottom: 30 }}
      role="img" aria-label="List an item, a local Maker repairs or upcycles it, then someone shops it, and around again. Makers are local repairers, tailors, woodworkers and upcyclers.">
      {track}
      <div className="relative flex flex-col" style={{ gap: 36 }}>
        {steps.map((stepItem, idx) => {
          const size = stepItem.big ? 56 : 48;
          const StepIcon = stepItem.Icon;
          return (
            <div key={stepItem.title} className="flex items-center gap-4 text-left">
              <div className="flex justify-center shrink-0" style={{ width: 56 }}>
                <div ref={nodeRefs[idx]} className="flex items-center justify-center"
                  style={{ width: size, height: size, borderRadius: size / 2, background: stepItem.big ? theme.primary : theme.accent, boxShadow: `0 0 0 6px ${theme.background}` }}>
                  <StepIcon size={20} style={{ color: stepItem.big ? theme.primaryForeground : theme.accentForeground }} />
                </div>
              </div>
              <div>
                <p className="text-base font-semibold mb-0.5">{stepItem.title}</p>
                <p className="text-[13px] leading-relaxed" style={{ color: theme.mutedForeground }}>{stepItem.text}</p>
              </div>
            </div>
          );
        })}
      </div>
      <p className="text-xs text-left" style={{ color: theme.mutedForeground, marginTop: 22, marginLeft: -24 }}>and around again</p>
    </div>
  );
}

function DashboardView({ searchTerm, setSearchTerm, scrollToResults, onResultsShown, onMessagesClick, onSelectItem, onGoListings, onGoPost, onGoHome, onCartClick, onAccountClick, onSignOut, onBecomeMaker, profile, cartCount }) {

  useEffect(() => {
    if (!scrollToResults) return;
    const t = setTimeout(() => {
      if (resultsRef.current) resultsRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
      if (onResultsShown) onResultsShown();

  const [priceRange, setPriceRange] = useState("any");

  const inPriceRange = (item, range) => {
    const p = priceValue(item);
    if (range === "under50") return p < 50;
    if (range === "50to100") return p >= 50 && p <= 100;
    if (range === "over100") return p > 100;
    return true;
  };

  let filtered = activeCategory === "All" ? listings : listings.filter((l) => l.category === activeCategory);

  }
  filtered = [...filtered].sort((a, b) => {
    if (sortBy === "price-asc") return priceValue(a) - priceValue(b);
    if (sortBy === "price-desc") return priceValue(b) - priceValue(a);
    if (sortBy === "rating-desc") return b.makerStats.rating - a.makerStats.rating;
    if (sortBy === "refurbished-first") return a.pathway === "Refurbished" ? -1 : b.pathway === "Refurbished" ? 1 : 0;
    if (sortBy === "upcycled-first") return a.pathway === "Upcycled" ? -1 : b.pathway === "Upcycled" ? 1 : 0;
    return 0;
  });

  return (
    <div>

      </div>
      <main className="px-4 md:px-8 py-8 max-w-6xl mx-auto">

          <div className="flex flex-wrap items-center gap-2">
            <div style={{ border: `0.5px solid ${theme.border}` }} className="flex items-center gap-2 rounded-md px-3 h-9 text-sm">
              <SlidersHorizontal size={14} style={{ color: theme.mutedForeground }} />
              <select value={priceRange} onChange={(e) => setPriceRange(e.target.value)} className="outline-none border-none text-sm bg-transparent">
                <option value="any">Any price</option><option value="under50">Under $50</option><option value="50to100">$50 to $100</option><option value="over100">Over $100</option>
              </select>
            </div>
            <div style={{ border: `0.5px solid ${theme.border}` }} className="flex items-center gap-2 rounded-md px-3 h-9 text-sm">
              <ShieldCheck size={14} style={{ color: theme.mutedForeground }} />
              <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)} className="outline-none border-none text-sm bg-transparent">
                <option value="any">Any status</option>
                {STATUSES.map((s) => <option key={s} value={s}>{s}</option>)}

              <ArrowUpDown size={14} style={{ color: theme.mutedForeground }} />

              <button key={cat} onClick={() => setActiveCategory(cat)} onMouseEnter={() => setHoveredCategory(cat)} onMouseLeave={() => setHoveredCategory(null)}

// One conversation per person. Names are the person key in this prototype.
const personKey = (name) => name.trim().toLowerCase();

// Short, human time label: "2:14 PM" today, "Yesterday", otherwise "Sep 20".
function formatMessageTime(date) {
  const now = new Date();
  const sameDay = date.toDateString() === now.toDateString();
  if (sameDay) return date.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
  if (date.toDateString() === yesterday.toDateString()) return "Yesterday";
  return date.toLocaleDateString([], { month: "short", day: "numeric" });
}

const sameRef = (a, b) => (!a && !b) || (a && b && a.kind === b.kind && a.id === b.id);

// Simulated reply. The first message about a new item or job gets a reply
// that mentions it; everything else gets a friendly general reply.
function simulatedReply(ref, isNewTopic, replyCount) {
  if (ref && isNewTopic) {
    return ref.kind === "item"
      ? `Thanks for your interest in the ${ref.title.toLowerCase()}! It's still available. Happy to answer any questions.`
      : `Thanks for reaching out about my ${ref.title.toLowerCase()}! What did you have in mind?`;
  }
  const general = [
    "Sounds good to me!",
    "Great question. Let me check and get back to you shortly.",
    "Thanks, that works for me.",
    "I can do pickup most weekday evenings if that helps.",
  ];
  return general[replyCount % general.length];
}

    if (endRef.current) endRef.current.scrollIntoView({ block: "end" });
  }, [messages.length, isTyping]);

  const handleSend = () => {
    if (text.trim() === "") return;
    onSend(text, activeRef);
    setText("");
  };

  // Show an "About" note when a message starts a new topic, and a time
  // under the last bubble in each run from the same sender.
  let lastRef = null;

  return (
    <div>
      <TopBar onMessagesClick={onMessagesClick} onBack={onBack} onLogoClick={onGoBrowse} onBrowseClick={onGoBrowse} onListingsClick={onGoListings} onPostClick={onGoPost}
        onCartClick={onCartClick} onAccountClick={onAccountClick} onSignOut={onSignOut} profile={profile} cartCount={cartCount} activeNav="" />
      <main className="px-8 py-8 max-w-lg mx-auto">
        <div className="flex items-center justify-between gap-3 mb-1">
          <div className="flex items-center gap-3 min-w-0">
            <Avatar className="w-9 h-9 shrink-0"><AvatarFallback style={{ background: theme.accent, color: theme.accentForeground }}>{name.charAt(0).toUpperCase()}</AvatarFallback></Avatar>
            <p className="text-sm font-medium truncate">{name}</p>
          </div>
          <button onClick={onMessagesClick} className="text-xs font-medium shrink-0" style={{ color: theme.primary }}>All messages</button>
        </div>
        <Separator className="mb-4 mt-3" />

        <div className="flex flex-col gap-2 mb-4 overflow-y-auto pr-1" style={{ minHeight: "240px", maxHeight: "55vh" }}>
          {messages.length === 0 && (
            <p className="text-xs text-center mt-8" style={{ color: theme.mutedForeground }}>
              This is the start of your conversation with {name}.
            </p>
          )}
          {messages.map((m, i) => {
            const showRef = m.ref && !sameRef(m.ref, lastRef);
            if (m.ref) lastRef = m.ref;
            const next = messages[i + 1];
            const endOfRun = !next || next.from !== m.from;
            const mine = m.from === "me";
            return (
              <React.Fragment key={m.id}>
                {showRef && (
                  <p className={`text-xs mt-2 ${mine ? "self-end" : "self-start"}`} style={{ color: theme.mutedForeground }}>
                    About: {m.ref.title}
                  </p>
                )}
                <div className={`max-w-[75%] rounded-md px-3 py-2 text-sm ${mine ? "self-end" : "self-start"}`}
                  style={{ background: mine ? theme.primary : theme.muted, color: mine ? theme.primaryForeground : theme.foreground }}>
                  {m.text}
                </div>
                {endOfRun && (
                  <span className={`text-[10px] -mt-1 ${mine ? "self-end" : "self-start"}`} style={{ color: theme.mutedForeground }}>
                    {formatMessageTime(m.sentAt)}
                  </span>
                )}
              </React.Fragment>
            );
          })}
          {isTyping && (
            <div className="self-start rounded-md px-3 py-2 text-sm" style={{ background: theme.muted, color: theme.mutedForeground }}>
              {name} is typing...
            </div>
          )}
          <div ref={endRef} />
        </div>

        {activeRef && (
          <div className="flex items-center gap-2 mb-2">
            <span style={{ background: theme.muted, color: theme.foreground }} className="text-xs rounded-full pl-3 pr-1 py-1 flex items-center gap-1">
              About: {activeRef.title}
              <button onClick={onClearRef} aria-label="Remove item from message" title="Remove item from message"
                className="w-4 h-4 rounded-full flex items-center justify-center" style={{ color: theme.mutedForeground }}>×</button>
            </span>
          </div>
        )}
        <div className="flex items-center gap-2">
          <Input placeholder="Write a message..." value={text} onChange={(e) => setText(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") handleSend(); }} className="flex-1" aria-label={`Message ${name}`} />
          <PrimaryButton onClick={handleSend} className="px-4">Send</PrimaryButton>
        </div>
        <p className="text-xs mt-2" style={{ color: theme.mutedForeground }}>Full pickup details unlock once a claim or purchase is confirmed.</p>
      </main>
      <Footer />
    </div>
  );
}

function InboxView({ onMessagesClick, conversations, typing, onOpenThread, onBack, onGoBrowse, onGoListings, onGoPost, onCartClick, onAccountClick, onSignOut, profile, cartCount }) {
  const threads = Object.values(conversations)
    .filter((t) => t.messages.length > 0)
    .sort((a, b) => b.messages[b.messages.length - 1].sentAt - a.messages[a.messages.length - 1].sentAt);

  return (
    <div>
      <TopBar onMessagesClick={onMessagesClick} onBack={onBack} onLogoClick={onGoBrowse} onBrowseClick={onGoBrowse} onListingsClick={onGoListings} onPostClick={onGoPost}
        onCartClick={onCartClick} onAccountClick={onAccountClick} onSignOut={onSignOut} profile={profile} cartCount={cartCount} activeNav="" />
      <main className="px-8 py-8 max-w-lg mx-auto">
        <h1 className="text-xl font-medium mb-1">Messages</h1>
        <p className="text-xs mb-4" style={{ color: theme.mutedForeground }}>Conversations with Makers and owners you've contacted.</p>
        <Separator className="mb-2" />

        {threads.length === 0 ? (
          <div className="text-center py-12">
            <div style={{ background: theme.muted, color: theme.mutedForeground }} className="w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-3">
              <ChatIcon size={20} />
            </div>
            <p className="text-sm font-medium mb-1">No messages yet</p>
            <p className="text-xs mb-6" style={{ color: theme.mutedForeground }}>Tap the chat icon on any item or job to ask a question.</p>
            <Button variant="outline" onClick={onGoBrowse}>Browse the marketplace</Button>
          </div>
        ) : (
          <ul className="flex flex-col">
            {threads.map((t) => {
              const last = t.messages[t.messages.length - 1];
              const isTyping = typing[t.personId];
              const preview = isTyping ? `${t.name} is typing...` : `${last.from === "me" ? "You: " : ""}${last.text}`;
              return (
                <li key={t.personId} style={{ borderBottom: `0.5px solid ${theme.border}` }}>
                  <button onClick={() => onOpenThread(t.personId)} className="w-full flex items-center gap-3 py-3 text-left hover:opacity-80"
                    aria-label={`Open conversation with ${t.name}`}>
                    <Avatar className="w-10 h-10 shrink-0"><AvatarFallback style={{ background: theme.accent, color: theme.accentForeground }}>{t.name.charAt(0).toUpperCase()}</AvatarFallback></Avatar>
                    <div className="flex-1 min-w-0">
                      <div className="flex items-baseline justify-between gap-2">
                        <p className="text-sm font-medium truncate">{t.name}</p>
                        <span className="text-xs shrink-0" style={{ color: theme.mutedForeground }}>{formatMessageTime(last.sentAt)}</span>
                      </div>
                      <p className="text-xs truncate" style={{ color: theme.mutedForeground, fontStyle: isTyping ? "italic" : "normal" }}>{preview}</p>
                    </div>
                  </button>
                </li>
              );
            })}
          </ul>
        )}
      </main>
      <Footer />
    </div>
  );
}

/* ---------- root ---------- */
function CircuvoDashboard() {
  const [view, setView] = useState("onboarding1");
  const [activeItem, setActiveItem] = useState(null);
  const [activeJob, setActiveJob] = useState(null);
  const [detailBackTarget, setDetailBackTarget] = useState("browse");
  const [jobs, setJobs] = useState(initialJobs);
  const [cart, setCart] = useState([]);
  const [purchasedItems, setPurchasedItems] = useState([]);
  const [profile, setProfile] = useState(null);
  const [pendingNext, setPendingNext] = useState("browse");
  const [makerReturnView, setMakerReturnView] = useState("browse");
  // Where to continue once someone finishes becoming a Maker (null means
  // go back to where they came from). Cancelling always goes back.
  const [makerNextView, setMakerNextView] = useState(null);
  const [searchTerm, setSearchTerm] = useState("");
  const [scrollToResults, setScrollToResults] = useState(false);

  // Every new screen opens at the top, like a normal page change.
  useEffect(() => { window.scrollTo(0, 0); }, [view]);
  // Messaging: all conversations live here so they persist while
  // navigating, and reset on a full reload like the rest of the app.
  const [conversations, setConversations] = useState({}); // { [personId]: { personId, name, messages: [] } }
  const [typing, setTyping] = useState({});                // { [personId]: true } while a reply is pending
  const [activeThreadId, setActiveThreadId] = useState(null);
  const [activeRef, setActiveRef] = useState(null);        // item/job the next message is about
  const [chatBackView, setChatBackView] = useState("browse");
  const [inboxBackView, setInboxBackView] = useState("browse");

  // Returns true if the person already has a profile and can proceed.
  // Otherwise sends them to create one first, remembering where to
  // return to afterward.
  const requireProfile = (nextView) => {
    if (!profile) {
      setPendingNext(nextView);
      setView("createProfile");
      return false;
    }
    return true;
  };

  const submitListing = (draft) => {
    const num = (v) => (v && v.trim() !== "" ? parseInt(v.replace(/[^0-9]/g, ""), 10) || null : null);
    const isPaidJob = draft.pathway === "Refurbish" || draft.pathway === "Upcycle";
    const budgetMin = isPaidJob ? num(draft.budgetMin) : draft.pathway === "Plain sell" ? num(draft.plainSellPrice) : null;
    const budgetMax = isPaidJob ? num(draft.budgetMax) : null;
    const note = draft.description.trim() ||
      (draft.pathway === "Upcycle" && draft.upcycleGoal.trim() ? `Wants it turned into: ${draft.upcycleGoal.trim()}` : "No description provided.");
    const newJob = {
      id: Date.now(), title: draft.title.trim() || "Untitled item", category: draft.category, pathway: draft.pathway || "Plain sell", owner: "You",
      location: draft.location.trim() || "Vancouver", budgetMin, budgetMax, note,
    };
    setJobs((prev) => [newJob, ...prev]);
  };

  const addToCart = (item) => setCart((prev) => (prev.some((i) => i.id === item.id) ? prev : [...prev, item]));
  const removeFromCart = (id) => setCart((prev) => prev.filter((i) => i.id !== id));
  const checkoutCart = () => { setPurchasedItems(cart); setCart([]); setView("cartConfirmed"); };

  const goBrowse = () => { setView("browse"); setActiveItem(null); setActiveJob(null); };
  const goListings = () => { setView("listings"); setActiveJob(null); };
  const goPost = () => { if (!requireProfile("post")) return; setView("post"); };
  const goDetail = (item, backTo = "browse") => { setActiveItem(item); setDetailBackTarget(backTo); setView("detail"); };
  const backFromDetail = () => { if (detailBackTarget === "post") goPost(); else goBrowse(); setDetailBackTarget("browse"); };

  const attemptCheckout = () => { if (!requireProfile("checkout")) return; setView("checkout"); };

  const attemptGiveQuote = () => {
    setMakerReturnView("jobDetail");
    setMakerNextView("quoteForm");
    if (!requireProfile("jobDetail")) return;
    if (!profile.isMaker) { setView("becomeMaker"); return; }
    setView("quoteForm");
  };
  const attemptClaim = () => {
    setMakerReturnView("jobDetail");
    setMakerNextView(null);
    if (!requireProfile("jobDetail")) return;
    if (!profile.isMaker) { setView("becomeMaker"); return; }
    setView("jobClaimed");
  };
  const attemptBecomeMaker = () => {
    setMakerReturnView("browse");
    setMakerNextView(null);
    if (!requireProfile("becomeMaker")) return;
    if (profile.isMaker) return;
    setView("becomeMaker");
  };

  // Opens (or continues) the conversation with a person. One thread per
  // person: if it exists it is reused, otherwise it is created. ref notes
  // which item or job the next message is about. Messaging needs a
  // profile, same as posting, buying, or quoting; after signing up the
  // person lands straight in the conversation.
  const openThread = (name, ref, backView) => {
    const id = personKey(name);
    setConversations((prev) => (prev[id] ? prev : { ...prev, [id]: { personId: id, name, messages: [] } }));
    setActiveThreadId(id);
    setActiveRef(ref || null);
    setChatBackView(backView);
    if (!profile) { setPendingNext("chat"); setView("createProfile"); return; }
    setView("chat");
  };

  const attemptMessage = (recipientName, ref, backView) => openThread(recipientName, ref, backView);

  const openInbox = () => {
    if (view !== "inbox" && view !== "chat") setInboxBackView(view);
    setView("inbox");
  };

  const openThreadFromInbox = (personId) => {
    setActiveThreadId(personId);
    setActiveRef(null);
    setChatBackView("inbox");
    setView("chat");
  };

  const sendMessage = (personId, text, ref) => {
    const body = text.trim();
    if (!body) return;
    const thread = conversations[personId];
    const prior = thread ? thread.messages : [];
    const lastMine = [...prior].reverse().find((m) => m.from === "me");
    const isNewTopic = !!ref && !(lastMine && sameRef(lastMine.ref, ref));
    const replyCount = prior.filter((m) => m.from === "them").length;
    const mine = { id: `m${Date.now()}${Math.random().toString(36).slice(2, 6)}`, from: "me", text: body, sentAt: new Date(), ref: ref || null };
    const append = (msg) => setConversations((prev) => {
      const t = prev[personId];
      if (!t) return prev;
      return { ...prev, [personId]: { ...t, messages: [...t.messages, msg] } };
    });
    append(mine);
    setTyping((prev) => ({ ...prev, [personId]: true }));
    setTimeout(() => {
      append({ id: `m${Date.now()}r`, from: "them", text: simulatedReply(ref, isNewTopic, replyCount), sentAt: new Date(), ref: null });
      setTyping((prev) => { const next = { ...prev }; delete next[personId]; return next; });
    }, 900 + Math.random() * 600);
  };

  const onProfileCreated = ({ name, contact }) => {
    setProfile({ name, contact, isMaker: false });
    setView(pendingNext);
  };
  const onMakerCreated = (makerInfo) => {
    setProfile((prev) => ({ ...prev, isMaker: true, ...makerInfo }));
    setView(makerNextView || makerReturnView);
  };

  // Clicking the header account spot: if signed out, opens sign-in and
  // remembers the current screen to return to. If already signed in,
  // it opens the actual profile page.
  const goAccount = () => {
    if (!profile) {
      setPendingNext(view);
      setView("createProfile");
      return;
    }
    setView("myProfile");
  };

  const signOut = () => {
    setProfile(null);
    setConversations({});
    setTyping({});
    setActiveThreadId(null);
    goBrowse();
  };

  return (
    <HeaderSearchContext.Provider value={{
      search: (q) => { setSearchTerm(q); goBrowse(); setScrollToResults(true); },
      showResults: () => setScrollToResults(true) }}>
    <FooterNavContext.Provider value={{ goBrowse, goPost, goListings,
      becomeMaker: () => { if (profile && profile.isMaker) goAccount(); else attemptBecomeMaker(); } }}>
    <div style={{ background: theme.background, color: theme.foreground, fontFamily: "Montserrat, -apple-system, Segoe UI, Roboto, sans-serif" }} className="min-h-screen w-full">
      {view === "onboarding1" && <OnboardingWelcome onNext={() => setView("onboarding2")} onSkip={goBrowse} />}
      {view === "onboarding2" && <OnboardingPathways onNext={goBrowse} onSkip={goBrowse} />}
      {view === "browse" && (
        <DashboardView searchTerm={searchTerm} setSearchTerm={setSearchTerm} scrollToResults={scrollToResults} onResultsShown={() => setScrollToResults(false)}
          onMessagesClick={openInbox} onGoListings={goListings} onGoPost={goPost} onGoHome={goBrowse} onCartClick={() => setView("cart")} onAccountClick={goAccount} onSignOut={signOut} onBecomeMaker={attemptBecomeMaker} profile={profile} cartCount={cart.length}
          onSelectItem={(item) => { setActiveItem(item); setView("detail"); }} />
      )}
      {view === "detail" && activeItem && (
        <ItemDetailView onMessagesClick={openInbox} item={activeItem} cart={cart} onBack={backFromDetail} onLogoClick={goBrowse} onGoBrowse={goBrowse} onGoListings={goListings} onGoPost={goPost} onAccountClick={goAccount} onSignOut={signOut} profile={profile}
          onCartClick={() => setView("cart")} cartCount={cart.length} onViewProfile={() => setView("profile")} onAddToCart={addToCart}
          onMessage={() => attemptMessage(activeItem.maker, { kind: "item", id: activeItem.id, title: activeItem.title }, "detail")} />
      )}
      {view === "profile" && activeItem && (
        <ProviderProfileView onMessagesClick={openInbox} item={activeItem} onBack={() => setView("detail")} onLogoClick={goBrowse} onGoBrowse={goBrowse} onGoListings={goListings} onGoPost={goPost} onAccountClick={goAccount} onSignOut={signOut} profile={profile}
          onCartClick={() => setView("cart")} cartCount={cart.length} />
      )}
      {view === "cart" && (
        <CartView onMessagesClick={openInbox} cart={cart} onRemove={removeFromCart} onCheckout={attemptCheckout} onGoBrowse={goBrowse} onGoListings={goListings} onGoPost={goPost} onAccountClick={goAccount} onSignOut={signOut} profile={profile}
          onGoHome={goBrowse} onCartClick={() => setView("cart")} />
      )}
      {view === "checkout" && (
        <CheckoutView onMessagesClick={openInbox} cart={cart} onPlaceOrder={checkoutCart} onBack={() => setView("cart")} onGoBrowse={goBrowse} onGoListings={goListings} onGoPost={goPost} onAccountClick={goAccount} onSignOut={signOut} profile={profile}
          onGoHome={goBrowse} onCartClick={() => setView("cart")} />
      )}
      {view === "cartConfirmed" && (
        <CartConfirmedView onMessagesClick={openInbox} purchasedItems={purchasedItems} onGoBrowse={goBrowse} onGoListings={goListings} onGoPost={goPost} onGoHome={goBrowse} onCartClick={() => setView("cart")} onAccountClick={goAccount} onSignOut={signOut} profile={profile} />
      )}
      {view === "listings" && (
        <ListingsView onMessagesClick={openInbox} jobs={jobs} onGoBrowse={goBrowse} onGoPost={goPost} onGoHome={goBrowse} onCartClick={() => setView("cart")} onAccountClick={goAccount} onSignOut={signOut} profile={profile} cartCount={cart.length}
          onSelectJob={(job) => { setActiveJob(job); setView("jobDetail"); }} />
      )}
      {view === "jobDetail" && activeJob && (
        <JobDetailView onMessagesClick={openInbox} job={activeJob} onBack={goListings} onGoBrowse={goBrowse} onGoPost={goPost} onGoHome={goBrowse} onCartClick={() => setView("cart")} onAccountClick={goAccount} onSignOut={signOut} profile={profile} cartCount={cart.length}
          onGiveQuote={attemptGiveQuote} onClaim={attemptClaim} onMessage={() => attemptMessage(activeJob.owner, { kind: "job", id: activeJob.id, title: activeJob.title }, "jobDetail")} />
      )}
      {view === "quoteForm" && activeJob && (
        <QuoteFormView onMessagesClick={openInbox} job={activeJob} onBack={() => setView("jobDetail")} onGoBrowse={goBrowse} onGoPost={goPost} onGoHome={goBrowse} onCartClick={() => setView("cart")} onAccountClick={goAccount} onSignOut={signOut} profile={profile}
          cartCount={cart.length} onSubmitQuote={() => setView("quoteSent")} />
      )}
      {view === "quoteSent" && activeJob && (
        <QuoteSentView onMessagesClick={openInbox} job={activeJob} onGoListings={goListings} onGoBrowse={goBrowse} onGoPost={goPost} onGoHome={goBrowse} onCartClick={() => setView("cart")} onAccountClick={goAccount} onSignOut={signOut} profile={profile} cartCount={cart.length} />
      )}
      {view === "jobClaimed" && activeJob && (
        <JobClaimedView onMessagesClick={openInbox} job={activeJob} onGoListings={goListings} onGoBrowse={goBrowse} onGoPost={goPost} onGoHome={goBrowse} onCartClick={() => setView("cart")} onAccountClick={goAccount} onSignOut={signOut} profile={profile} cartCount={cart.length} />
      )}
      {view === "post" && (
        <PostFlow onMessagesClick={openInbox} onGoBrowse={goBrowse} onGoListings={goListings} onGoHome={goBrowse} onCartClick={() => setView("cart")} onAccountClick={goAccount} onSignOut={signOut} profile={profile} cartCount={cart.length} onSubmitListing={submitListing}
          onViewTransformation={(pathway) => { const exampleTitle = pathway === "Upcycle" ? "Denim tote bag" : "Rocking chair"; const example = listings.find((l) => l.title === exampleTitle) || listings[0]; goDetail(example, "post"); }} />
      )}

      {view === "createProfile" && (
        <CreateProfileView onMessagesClick={openInbox} onSubmit={onProfileCreated} onCancel={goBrowse} profile={profile} />
      )}
      {view === "becomeMaker" && (
        <BecomeMakerView onMessagesClick={openInbox} onSubmit={onMakerCreated} onCancel={() => setView(makerReturnView)} profile={profile} />
      )}
      {view === "myProfile" && profile && (
        <MyProfileView onMessagesClick={openInbox} profile={profile} onBack={goBrowse} onBecomeMaker={attemptBecomeMaker} />
      )}
      {view === "inbox" && profile && (
        <InboxView onMessagesClick={openInbox} conversations={conversations} typing={typing} onOpenThread={openThreadFromInbox}
          onBack={() => setView(inboxBackView)} onGoBrowse={goBrowse} onGoListings={goListings} onGoPost={goPost}
          onCartClick={() => setView("cart")} onAccountClick={goAccount} onSignOut={signOut} profile={profile} cartCount={cart.length} />
      )}
      {view === "chat" && activeThreadId && conversations[activeThreadId] && (
        <ChatView onMessagesClick={openInbox}
          thread={conversations[activeThreadId]}
          isTyping={!!typing[activeThreadId]}
          activeRef={activeRef}
          onClearRef={() => setActiveRef(null)}
          onSend={(text, ref) => sendMessage(activeThreadId, text, ref)}
          onBack={() => setView(chatBackView)}
          onGoBrowse={goBrowse}
          onGoListings={goListings}
          onGoPost={goPost}
          onCartClick={() => setView("cart")}
          onAccountClick={goAccount}
          onSignOut={signOut}
          profile={profile}
          cartCount={cart.length}
        />
      )}
    </div>
    </FooterNavContext.Provider>
    </HeaderSearchContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<CircuvoDashboard />);
</script>
</body>
</html>
